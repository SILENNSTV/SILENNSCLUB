<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<meta name="description" content="SILENNS CLUB: comunidad internacional de Sim Racing, rally y competición.">
<title>SILENNS CLUB | Sim Racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b12;--panel:#101522;--line:#263348;--cyan:#00e5ff;--violet:#9b5cff;--pink:#ff36b8;--white:#f4f7ff;--muted:#94a3b8;--green:#35e6a0}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:85px}
body{background:var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
.container{width:min(1160px,92%);margin:auto}
header{position:sticky;top:0;z-index:50;background:#080b12ed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font:900 30px 'Barlow Condensed';letter-spacing:2px;white-space:nowrap}
.logo span,.section-head h2 span{color:var(--cyan)}
.navlinks{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.navlinks a{font-size:10px;font-weight:800;color:#cbd5e1;text-transform:uppercase;letter-spacing:.7px}
.navlinks a:hover{color:var(--cyan)}
.social{display:flex;gap:8px}
.social a,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 15px;border:1px solid var(--line);border-radius:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.social a:hover,.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{background:var(--cyan);color:#061018;border-color:var(--cyan)}
.btn.primary:hover{background:#8af5ff;color:#061018}
.btn.purple{border-color:var(--violet);color:#c7a8ff}
.btn.danger{border-color:#8d3659;color:#ff8bbd}
.menu-toggle{display:none;background:none;border:1px solid var(--line);color:white;padding:9px;border-radius:6px}
.hero{min-height:570px;display:flex;align-items:center;position:relative;overflow:hidden;background:linear-gradient(90deg,#080b12 0%,#080b12e8 43%,#080b1260 100%),url('https://static.wixstatic.com/media/89553f_fba7570ab7e846ca8e7d323aa5ad71e6~mv2.jpg/v1/fill/w_2000,h_1100,al_c,q_85/89553f_fba7570ab7e846ca8e7d323aa5ad71e6~mv2.jpg') center/cover}
.hero:after{content:"";position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink))}
.hero-content{position:relative;z-index:1;max-width:720px;padding:75px 0}
.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:4px;text-transform:uppercase;margin-bottom:16px}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}
.hero h1{font-size:clamp(58px,9vw,105px);line-height:.88;font-weight:900}
.hero h1 span{display:block;color:var(--cyan)}
.hero p{color:#c2ccda;line-height:1.8;max-width:570px;margin:24px 0 28px;font-size:14px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.section{padding:75px 0;scroll-margin-top:75px}
.section.alt{background:#0c111c;border-top:1px solid #182235;border-bottom:1px solid #182235}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:27px}
.section-head h2{font-size:clamp(34px,5vw,52px);line-height:1}
.section-head p{color:var(--muted);font-size:12px;max-width:440px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-30px;position:relative;z-index:3}
.stat{background:var(--panel);border:1px solid var(--line);padding:21px;border-radius:9px}
.stat strong{display:block;font:900 38px 'Barlow Condensed';color:var(--cyan)}
.stat span{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.card-body{padding:19px}
.card h3{font-size:25px;margin-bottom:8px}
.card p,.muted{color:var(--muted);font-size:12px;line-height:1.7}
.card-image{height:155px;background:linear-gradient(135deg,#12243a,#25153c);display:flex;align-items:center;justify-content:center;color:var(--cyan);font:900 32px 'Barlow Condensed';letter-spacing:2px}
.tag{display:inline-block;border:1px solid #315064;color:var(--cyan);padding:5px 9px;border-radius:4px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:11px}
.list{display:grid;gap:11px}
.list-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.list-item h3{font-size:21px}
.list-item p{font-size:11px;color:var(--muted);margin-top:4px}
.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;font-size:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{padding:22px}
.panel h3{font-size:26px;margin-bottom:15px}
form{display:grid;gap:12px}
  <div class="panel"><span class="tag">World Rally Championship</span><h3>WRC</h3><p class="muted">Especiales, superficies cambiantes y velocidad al límite.</p><div class="list" id="wrc-championships"><div class="empty">Cargando campeonatos WRC...</div></div></div>
  <div class="panel"><span class="tag">Formula Racing</span><h3>F1 25</h3><p class="muted">Precisión, estrategia y velocidad en cada circuito.</p><div class="list" id="f1-championships"><div class="empty">Cargando campeonatos F1...</div></div></div>
 </div>
 <div class="section-head" style="margin-top:35px"><div><div class="eyebrow">Todas las categorías</div><h2>PRÓXIMAS <span>INSCRIPCIONES</span></h2></div></div>
 <div class="list" id="championships-list"><div class="empty">Cargando campeonatos...</div></div>
</div></section>

<section class="section alt" id="eventos"><div class="container">
 <div class="section-head"><div><div class="eyebrow">Calendario</div><h2>PRÓXIMOS <span>EVENTOS</span></h2></div><p>Fechas y competencias de la comunidad SILENNS CLUB.</p></div>
 <div class="list" id="events-list"><div class="empty">Cargando eventos...</div></div>
</div></section>

<section class="section" id="pilotos"><div class="container">
 <div class="section-head"><div><div class="eyebrow">Nuestra comunidad</div><h2>LOS <span>PILOTOS</span></h2></div><p>Conocé a los pilotos que forman parte de la comunidad.</p></div>
 <div class="panel" id="profile-panel"><h3>MI PERFIL DE PILOTO</h3><p class="muted" style="margin-bottom:16px">Ingresá a tu cuenta para crear o actualizar tu perfil.</p>
  <form id="profile-form">
   <div class="form-row"><div class="field"><label for="profile-full-name">Nombre completo</label><input id="profile-full-name" name="full_name" placeholder="Tu nombre"></div><div class="field"><label for="profile-display-name">Nombre de piloto</label><input id="profile-display-name" name="display_name" placeholder="Tu nickname"></div></div>
   <div class="form-row"><div class="field"><label for="profile-country">País</label><input id="profile-country" name="country" placeholder="Argentina"></div><div class="field"><label for="profile-birth-date">Fecha de nacimiento</label><input id="profile-birth-date" name="birth_date" type="date"></div></div>
   <div class="form-row"><div class="field"><label for="profile-platform">Plataforma</label><select id="profile-platform" name="platform"><option value="">Seleccionar</option><option>PC</option><option>PlayStation</option><option>Xbox</option></select></div><div class="field"><label for="profile-ea-id">EA ID</label><input id="profile-ea-id" name="ea_id" placeholder="Tu EA ID"></div></div>
   <div class="form-row"><div class="field"><label for="profile-input-device">Control</label><select id="profile-input-device" name="input_device"><option value="">Seleccionar</option><option>Volante</option><option>Joystick</option><option>Teclado</option></select></div><div class="field"><label for="profile-wheel-model">Modelo de volante</label><input id="profile-wheel-model" name="wheel_model" placeholder="Ej. MOZA R3"></div></div>
   <div class="field"><label for="profile-avatar">Foto de perfil</label><input id="profile-avatar" name="avatar" type="file" accept="image/*"></div>
   <div class="field"><label>Juegos</label><div class="checks"><label><input type="checkbox" name="games" value="EA SPORTS WRC"> EA SPORTS WRC</label><label><input type="checkbox" name="games" value="F1 25"> F1 25</label></div></div>
   <button class="btn primary" type="submit">Guardar mi perfil</button>
  </form>
 </div>
 <div class="section-head" style="margin-top:35px"><div><div class="eyebrow">Roster</div><h2>PILOTOS <span>REGISTRADOS</span></h2></div></div>
 <div class="grid" id="pilots-list"><div class="empty">Cargando pilotos...</div></div>
</div></section>

<section class="section alt" id="equipos"><div class="container">
 <div class="section-head"><div><div class="eyebrow">Escuderías</div><h2>NUESTROS <span>EQUIPOS</span></h2></div><p>Creá tu propia escudería o sumate a un equipo existente.</p></div>
 <div class="two-col">
  <div class="panel"><h3>CREAR UN EQUIPO</h3><form id="team-form"><div class="field"><label for="team-name">Nombre del equipo</label><input id="team-name" name="name" required placeholder="Nombre de tu escudería"></div><div class="field"><label for="team-country">País</label><input id="team-country" name="country" placeholder="Argentina"></div><div class="field"><label for="team-logo">Logo (URL)</label><input id="team-logo" name="logo_url" placeholder="https://..."></div><button class="btn primary" type="submit">Crear equipo</button></form></div>
  <div class="panel"><h3>MI EQUIPO</h3><p class="muted" id="my-team-info">Iniciá sesión para consultar tu equipo.</p><form id="join-team-form" style="margin-top:16px"><div class="field"><label for="join-team-select">Elegir equipo</label><select id="join-team-select" name="team_id"><option value="">Seleccionar equipo</option></select></div><button class="btn purple" type="submit">Solicitar / Unirme al equipo</button></form></div>
 </div>
 <div class="section-head" style="margin-top:35px"><div><div class="eyebrow">Organizaciones</div><h2>ESCUDERÍAS <span>REGISTRADAS</span></h2></div></div>
 <div class="grid" id="teams-list"><div class="empty">Cargando equipos...</div></div>
</div></section>

<section class="section" id="resultados"><div class="container">
 <div class="section-head"><div><div class="eyebrow">Clasificaciones</div><h2>RESULTADOS <span>Y PUNTOS</span></h2></div><p>Seguimiento de resultados oficiales cargados por la administración.</p></div>
 <div class="panel"><h3>CLASIFICACIÓN DE EQUIPOS</h3><div id="standings-list"><div class="empty">Cargando resultados...</div></div></div>
</div></section>

<section class="section alt" id="hall"><div class="container">
 <div class="section-head"><div><div class="eyebrow">Historia y campeones</div><h2>HALL OF <span>FAME</span></h2></div><p>Los equipos y protagonistas que dejaron su marca en SILENNS CLUB.</p></div>
 <div class="grid" id="champions-list"><div class="empty">Cargando Salón de la Fama...</div></div>
</div></section>

<section class="section" id="galeria"><div class="container">
 <div class="section-head"><div><div class="eyebrow">Momentos de carrera</div><h2>GALERÍA <span>CLUB</span></h2></div><p>Imágenes compartidas por los pilotos de la comunidad.</p></div>
 <div class="grid" id="gallery-list"><div class="empty">Cargando galería...</div></div>
</div></section>

<section class="section alt" id="comunidad"><div class="container"><div class="community">
 <div><div class="eyebrow">Join the community</div><h2>LA CARRERA <span style="color:var(--cyan)">EMPIEZA ACÁ</span></h2><p>Conectate con otros pilotos, enterate de las novedades y compartí tus carreras.</p></div>
 <div class="community-actions"><a class="btn primary" href="https://discord.gg/4dJ2nXrwN" target="_blank" rel="noopener">Entrar a Discord</a><a class="btn purple" href="https://www.tiktok.com/@silenns_tv" target="_blank" rel="noopener">TikTok</a></div>
</div></div></section>

<section class="section admin-only" id="admin"><div class="container">
 <div class="section-head"><div><div class="eyebrow">Control de la plataforma</div><h2>PANEL <span>ADMIN</span></h2></div><p>Herramientas de administración de SILENNS CLUB.</p></div>
 <div class="two-col">
  <div class="panel"><h3>CREAR CAMPEONATO</h3><form id="admin-championship-form"><div class="field"><label for="admin-champ-name">Nombre</label><input id="admin-champ-name" name="name" required></div><div class="field"><label for="admin-champ-game">Juego / categoría</label><select id="admin-champ-game" name="game"><option>EA SPORTS WRC</option><option>F1 25</option></select></div><div class="field"><label for="admin-champ-description">Descripción</label><textarea id="admin-champ-description" name="description"></textarea></div><div class="field"><label for="admin-champ-status">Estado</label><select id="admin-champ-status" name="status"><option>Abierto</option><option>Próximamente</option><option>En curso</option><option>Finalizado</option></select></div><button class="btn primary" type="submit">Publicar campeonato</button></form></div>
  <div class="panel"><h3>CREAR EVENTO</h3><form id="admin-event-form"><div class="field"><label for="admin-event-name">Nombre</label><input id="admin-event-name" name="name" required></div><div class="field"><label for="admin-event-country">País / ubicación</label><input id="admin-event-country" name="country"></div><div class="field"><label for="admin-event-date">Fecha y hora</label><input id="admin-event-date" name="starts_at" type="datetime-local"></div><div class="field"><label for="admin-event-status">Estado</label><select id="admin-event-status" name="status"><option>Próximo</option><option>Abierto</option><option>En curso</option><option>Finalizado</option></select></div><button class="btn primary" type="submit">Publicar evento</button></form></div>
  <div class="panel"><h3>CARGAR RESULTADO</h3><form id="admin-result-form"><div class="field"><label for="admin-result-event">Evento</label><select id="admin-result-event" name="event_id"><option value="">Seleccionar evento</option></select></div><div class="field"><label for="admin-result-team">Equipo</label><select id="admin-result-team" name="team_id"><option value="">Seleccionar equipo</option></select></div><div class="field"><label for="admin-result-points">Puntos</label><input id="admin-result-points" name="points" type="number" min="0" required></div><button class="btn primary" type="submit">Guardar resultado</button></form></div>
  <div class="panel"><h3>REGISTRAR CAMPEÓN</h3><form id="admin-champion-form"><div class="field"><label for="admin-champion-team">Equipo</label><select id="admin-champion-team" name="team_id"><option value="">Seleccionar equipo</option></select></div><div class="field"><label for="admin-champion-season">Temporada</label><input id="admin-champion-season" name="season" required></div><div class="field"><label for="admin-champion-description">Descripción</label><textarea id="admin-champion-description" name="description"></textarea></div><div class="field"><label for="admin-champion-date">Fecha</label><input id="admin-champion-date" name="date" type="date"></div><button class="btn primary" type="submit">Guardar campeón</button></form></div>
  <div class="panel"><h3>AGREGAR A GALERÍA</h3><form id="admin-gallery-form"><div class="field"><label for="admin-gallery-title">Título</label><input id="admin-gallery-title" name="title"></div><div class="field"><label for="admin-gallery-image">URL de imagen</label><input id="admin-gallery-image" name="image_url" type="url" required></div><button class="btn primary" type="submit">Publicar imagen</button></form></div>
 </div>
</div></section>
</main>

<footer><div class="container footer-inner"><a class="logo" href="#inicio">SILENNS <span>CLUB</span></a><p>Comunidad internacional de Sim Racing · Rally · Competition</p><p>© <span id="year"></span> SILENNS CLUB</p></div></footer>

<div class="modal" id="auth-modal" aria-hidden="true"><div class="modal-box">
 <div class="modal-top"><h2>MI CUENTA</h2><button class="close" id="auth-close" type="button" aria-label="Cerrar">×</button></div>
 <form id="auth-form"><div class="field"><label for="auth-email">Correo electrónico</label><input id="auth-email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="auth-password">Contraseña</label><input id="auth-password" name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" id="auth-submit" type="submit">Ingresar</button><button class="btn purple" id="auth-signup" type="button">Crear cuenta</button><button class="btn" id="auth-reset" type="button">Recuperar contraseña</button></form>
</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("menu-toggle").addEventListener("click",()=>document.getElementById("navlinks").classList.toggle("show"));
document.querySelectorAll("#navlinks a").forEach(link=>link.addEventListener("click",()=>document.getElementById("navlinks").classList.remove("show")));
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
